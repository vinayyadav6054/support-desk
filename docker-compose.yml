services:
  db:
    image: postgres:16-alpine
    container_name: supportdesk-db
    environment:
      POSTGRES_DB: supportdesk
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d supportdesk"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    container_name: supportdesk-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=supportdesk;Username=postgres;Password=${DB_PASSWORD}"
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: SupportDesk
      Jwt__Audience: SupportDeskClient
      Jwt__ExpiryMinutes: "120"
      Cors__AllowedOrigins: http://localhost:3000
      Seed__AdminName: ${ADMIN_NAME}
      Seed__AdminEmail: ${ADMIN_EMAIL}
      Seed__AdminPassword: ${ADMIN_PASSWORD}
    ports:
      - "5080:8080"

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5080
    container_name: supportdesk-web
    depends_on:
      - api
    ports:
      - "3000:3000"

volumes:
  pgdata:
